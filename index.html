<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1학년 5반 실시간 학급 게시판</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f5f6fa; color: #333; padding: 20px; }
        header { background: #4a90e2; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { color: #4a90e2; margin-bottom: 10px; border-bottom: 2px solid #e1e8ef; padding-bottom: 5px; }
        
        ul { list-style: none; }
        li { padding: 12px 0; border-bottom: 1px dashed #eee; display: flex; flex-direction: column; gap: 8px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; flex: 1; min-width: 120px; }
        .input-group input[type="file"] { padding: 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; background: #fff; }
        
        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: bold; }
        .btn-add { background: #4a90e2; color: white; }
        .btn-add:hover { background: #357abd; }
        .btn-del { background: #ff4d4d; color: white; padding: 4px 8px; font-size: 0.8rem; }
        .btn-del:hover { background: #cc0000; }
        
        /* 작성 시간 및 서브텍스트 스타일 */
        .time-tag { font-size: 0.8rem; color: #888; margin-left: 8px; font-weight: normal; }
        .sub-tag { color: #4a90e2; font-weight: bold; margin-left: 6px; }

        /* 더보기 버튼 스타일 */
        .btn-more { width: 100%; background: #f0f4f9; color: #4a90e2; border: 1px solid #d0dbe7; padding: 10px; margin-top: 10px; font-size: 0.9rem; border-radius: 6px; }
        .btn-more:hover { background: #e1eaf5; }

        /* 이미지 스타일 */
        .attached-img { max-width: 250px; max-height: 200px; border-radius: 6px; border: 1px solid #ddd; margin-top: 5px; cursor: pointer; object-fit: cover; }

        /* 수행평가 링크 및 고정 배너 스타일 */
        .fixed-link-banner {
            background-color: #eef6ff;
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fixed-link-banner span { font-weight: bold; color: #1a365d; }
        .btn-fixed-link { background: #4a90e2; color: white; text-decoration: none; padding: 8px 14px; border-radius: 5px; font-size: 0.9rem; }
        .btn-fixed-link:hover { background: #357abd; }

        .task-link { color: #2b6cb0; font-weight: bold; text-decoration: underline; margin-right: 6px; }
        .link-badge { background: #ebf8ff; color: #3182ce; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-left: 5px; text-decoration: none; border: 1px solid #bee3f8; }

        /* 시간표 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; text-align: center; margin-top: 5px; }
        th, td { border: 1px solid #e1e8ef; padding: 8px; font-size: 0.95rem; }
        th { background-color: #f0f4f9; color: #4a90e2; font-weight: bold; }
        .empty-cell { background-color: #fafafa; color: #ccc; }
    </style>
</head>
<body>

    <header>
        <h1>1학년 5반 실시간 학급 게시판</h1>
        <p>버튼으로 추가/삭제 시 다른 모든 친구들에게 실시간으로 반영됩니다.</p>
    </header>

    <!-- 📢 학급 안내사항 -->
    <div class="card">
        <h2>📢 학급 안내사항</h2>
        <div class="input-group">
            <input type="text" id="noticeInput" placeholder="공지 내용 입력">
            <input type="text" id="noticeSub" placeholder="날짜 (예: 08/27)" style="flex: 0.3;">
            <input type="file" id="noticeImg" accept="image/*">
            <button class="btn-add" id="btnNotice">추가</button>
        </div>
        <ul id="noticeList"></ul>
        <button class="btn-more" id="moreNotice" style="display: none;">👇 이전 안내사항 더보기</button>
    </div>

    <!-- 🗓️ 주간 시간표 -->
    <div class="card">
        <h2>🗓️ 주간 시간표</h2>
        <table>
            <thead>
                <tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>국어</td><td>수학</td><td>영어</td><td>체육</td><td>과학</td></tr>
                <tr><td>2</td><td>수학</td><td>영어</td><td>사회</td><td>국어</td><td>음악</td></tr>
                <tr><td>3</td><td>영어</td><td>과학</td><td>국어</td><td>수학</td><td>미술</td></tr>
                <tr><td>4</td><td>사회</td><td>국어</td><td>체육</td><td>영어</td><td>동아리</td></tr>
                <tr><td>5</td><td>과학</td><td>사회</td><td>수학</td><td>역사</td><td>국어</td></tr>
                <tr><td>6</td><td>체육</td><td>기술가정</td><td>음악</td><td>과학</td><td>자율</td></tr>
                <tr><td>7</td><td class="empty-cell">-</td><td>자율</td><td class="empty-cell">-</td><td>동아리</td><td class="empty-cell">-</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 📝 수행평가 일정 -->
    <div class="card">
        <h2>📝 수행평가 일정 및 과제제출</h2>
        
        <div class="fixed-link-banner">
            <span>📌 수행평가 공지 프로그램</span>
            <a href="https://pyu2010.github.io/notice/" target="_blank" class="btn-fixed-link">🚀 프로그램 바로가기</a>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="수행평가 내용">
            <input type="text" id="taskLink" placeholder="추가 링크 (선택)">
            <input type="text" id="taskSub" placeholder="D-day (예: D-3)" style="flex: 0.3;">
            <input type="file" id="taskImg" accept="image/*">
            <button class="btn-add" id="btnTask">추가</button>
        </div>
        <ul id="taskList"></ul>
        <button class="btn-more" id="moreTask" style="display: none;">👇 이전 수행평가 더보기</button>
    </div>

    <!-- 🎓 진로 및 진학 정보 -->
    <div class="card">
        <h2>🎓 진로 및 진학 정보</h2>
        <div class="input-group">
            <input type="text" id="careerInput" placeholder="진로/진학 소식">
            <input type="text" id="careerSub" placeholder="비고 (선택)" style="flex: 0.3;">
            <input type="file" id="careerImg" accept="image/*">
            <button class="btn-add" id="btnCareer">추가</button>
        </div>
        <ul id="careerList"></ul>
        <button class="btn-more" id="moreCareer" style="display: none;">👇 이전 진로정보 더보기</button>
    </div>

    <!-- Firebase SDK 불러오기 및 스크립트 실행 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByVK4dbNvtBdAAMdXGokpXeurGwoHop6c",
            authDomain: "classboard-project.firebaseapp.com",
            databaseURL: "https://classboard-project-default-rtdb.firebaseio.com",
            projectId: "classboard-project",
            storageBucket: "classboard-project.firebasestorage.app",
            messagingSenderId: "360680664355",
            appId: "1:360680664355:web:bfc9384a595dda2537f096",
            measurementId: "G-S2T1FC3GLY"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 기본 표시 개수: 3개
        const PAGE_SIZE = 3; 
        const viewLimits = { notice: PAGE_SIZE, task: PAGE_SIZE, career: PAGE_SIZE };

        // 현재 날짜 및 시간 생성
        function getFormattedDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}.${month}.${day} ${hours}:${minutes}`;
        }

        // 이미지 업로드 (ImgBB API 사용)
        async function uploadImage(fileInput) {
            if (!fileInput || !fileInput.files[0]) return null;
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://api.imgbb.com/1/upload?key=6d207722fc3d74d308016f9f30200ad2', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                return result.data.url;
            } catch (error) {
                alert('이미지 업로드 실패!');
                return null;
            }
        }

        // 항목 추가
        async function handleAdd(type, textId, fileId, subId = null, linkId = null) {
            const textInput = document.getElementById(textId);
            const fileInput = document.getElementById(fileId);
            const subInput = subId ? document.getElementById(subId) : null;
            const linkInput = linkId ? document.getElementById(linkId) : null;

            if (!textInput.value.trim()) {
                alert("내용을 입력해주세요!");
                return;
            }

            let linkUrl = linkInput ? linkInput.value.trim() : '';
            if (linkUrl && !linkUrl.startsWith('http://') && !linkUrl.startsWith('https://')) {
                linkUrl = 'https://' + linkUrl;
            }

            const imageUrl = await uploadImage(fileInput);
            const createdTime = getFormattedDate();

            const dbRef = ref(database, type);
            push(dbRef, {
                text: textInput.value,
                sub: subInput ? subInput.value : '',
                createdAt: createdTime,
                link: linkUrl,
                img: imageUrl || '',
                timestamp: Date.now()
            });

            textInput.value = '';
            fileInput.value = '';
            if (subInput) subInput.value = '';
            if (linkInput) linkInput.value = '';
        }

        // 실시간 조회 및 더보기 처리 (게시글 4개 이상 시 더보기 버튼 노출)
        function listenData(type, listId, moreBtnId) {
            const dbRef = ref(database, type);
            onValue(dbRef, (snapshot) => {
                const listElement = document.getElementById(listId);
                const moreBtn = document.getElementById(moreBtnId);
                listElement.innerHTML = '';
                
                const rawData = snapshot.val();
                if (!rawData) {
                    moreBtn.style.display = 'none';
                    return;
                }

                const keys = Object.keys(rawData).reverse(); // 최신순 정렬
                const totalCount = keys.length;
                const limit = viewLimits[type];
                const visibleKeys = keys.slice(0, limit);

                visibleKeys.forEach((key) => {
                    const item = rawData[key];
                    const li = document.createElement('li');

                    let titleHtml = item.text;
                    if (item.link) {
                        titleHtml = `<a href="${item.link}" target="_blank" class="task-link">${item.text}</a><a href="${item.link}" target="_blank" class="link-badge">🚀 바로가기</a>`;
                    }

                    let subHtml = item.sub ? `<span class="sub-tag">${item.sub}</span>` : '';
                    let timeHtml = item.createdAt ? `<span class="time-tag">(${item.createdAt})</span>` : '';
                    let imgHtml = item.img ? `<a href="${item.img}" target="_blank"><img src="${item.img}" class="attached-img" alt="첨부 이미지"></a>` : '';

                    li.innerHTML = `
                        <div class="item-header">
                            <span>${titleHtml} ${subHtml} ${timeHtml}</span>
                            <button class="btn-del">삭제</button>
                        </div>
                        ${imgHtml}
                    `;

                    li.querySelector('.btn-del').addEventListener('click', () => {
                        remove(ref(database, `${type}/${key}`));
                    });

                    listElement.appendChild(li);
                });

                // 총 개수가 4개 이상이고, 현재 보고 있는 개수가 전체보다 적을 때만 더보기 버튼 노출
                if (totalCount >= 4 && totalCount > limit) {
                    moreBtn.style.display = 'block';
                } else {
                    moreBtn.style.display = 'none';
                }
            });
        }

        // 추가 버튼 클릭 이벤트
        document.getElementById('btnNotice').addEventListener('click', () => handleAdd('notice', 'noticeInput', 'noticeImg', 'noticeSub'));
        document.getElementById('btnTask').addEventListener('click', () => handleAdd('task', 'taskInput', 'taskImg', 'taskSub', 'taskLink'));
        document.getElementById('btnCareer').addEventListener('click', () => handleAdd('career', 'careerInput', 'careerImg', 'careerSub'));

        // 더보기 버튼 클릭 이벤트 (3개씩 추가 노출)
        document.getElementById('moreNotice').addEventListener('click', () => { viewLimits.notice += PAGE_SIZE; listenData('notice', 'noticeList', 'moreNotice'); });
        document.getElementById('moreTask').addEventListener('click', () => { viewLimits.task += PAGE_SIZE; listenData('task', 'taskList', 'moreTask'); });
        document.getElementById('moreCareer').addEventListener('click', () => { viewLimits.career += PAGE_SIZE; listenData('career', 'careerList', 'moreCareer'); });

        // 실시간 동기화 시작
        listenData('notice', 'noticeList', 'moreNotice');
        listenData('task', 'taskList', 'moreTask');
        listenData('career', 'careerList', 'moreCareer');
    </script>
</body>
</html>
